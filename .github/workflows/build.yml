name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer@master
        with:
          command: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: setareh-apk
          path: bin/*.apk
